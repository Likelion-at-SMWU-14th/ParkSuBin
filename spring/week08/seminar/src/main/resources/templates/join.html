<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>

<h1>회원가입</h1>

<form th:action="@{/join}" method="post">

    <input
            type="text"
            name="username"
            placeholder="아이디">

    <input
            type="password"
            name="password"
            placeholder="비밀번호">

    <button type="submit">회원가입</button>

</form>

</body>
</html>
